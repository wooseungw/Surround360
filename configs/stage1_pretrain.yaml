# configs/stage1_vision_pretrain.yaml

# train.py가 참조할 현재 학습 단계 이름
stage_name: "vision_pretrain"

# Wandb 실행(run)의 고유 이름
wandb:
  name: "stage1-vision-pretrain"

model:
  # 1단계는 처음부터 학습하므로 로드할 체크포인트가 없음
  load_from_checkpoint: null
  
  # Vision Encoder 외 모든 모듈의 가중치를 동결
  freeze_modules:
    - 'qformer'
    - 'language_projection'
    - 'language_model'
    - 'itm_head'

data:
  # 1단계 학습에 사용할 데이터셋 경로
  train_csv_path: "./data/vision_pretrain_data/train.csv"
  valid_csv_path: "./data/vision_pretrain_data/valid.csv"

training_args:
  # 1단계 결과물이 저장될 경로
  output_dir: "./checkpoints/stage1_vision_pretrain"
  run_name: "stage1-vision-pretrain" # Trainer 내부 및 Wandb에 표시될 이름
  
  # 1단계에 적합한 학습 하이퍼파라미터
  num_train_epochs: 5
  learning_rate: 1.0e-4
  
  # 평가 및 저장 주기
  eval_steps: 500
  save_steps: 500
  
  # forward에 전달될 loss 가중치
  loss_specific_args:
    overlap_consistency_weight: 1.0