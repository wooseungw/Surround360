stage_name: "vision_pretrain"

wandb:
  name: "legacy_2stage_step1_vision"

model:
  load_from_checkpoint: null
  freeze_modules:
    - 'qformer'
    - 'language_projection'
    - 'language_model'
    - 'itm_head'

data:
  train_csv_path: "./data/quic360/train.csv"
  valid_csv_path: "./data/quic360/valid.csv"

training_args:
  output_dir: "./checkpoints/2stage_S1_vision"
  run_name: "2stage_S1_vision"
  num_train_epochs: 5
  learning_rate: 1e-4
  eval_steps: 500
  save_steps: 500
  loss_specific_args:
    overlap_consistency_weight: 1.0