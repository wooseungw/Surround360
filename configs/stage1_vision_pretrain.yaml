# configs/stage1_vision_pretrain.yaml (최종 수정본)

stage_name: "vision_pretrain"

wandb:
  name: "stage1-vision-pretrain"

model:
  load_from_checkpoint: null
  freeze_modules:
    - 'qformer'
    - 'text_encoder'
    - 'language_model'
    - 'itm_head'

data:
  train_csv_path: "./data/quic360/train.csv"
  valid_csv_path: "./data/quic360/valid.csv"
  # base.yaml의 max_length를 그대로 사용하거나, 필요시 여기서 덮어쓰기

# [핵심 수정] loss_specific_args와 같은 커스텀 인자는 별도의 최상위 섹션으로 분리합니다.
custom_args:
  loss_specific_args:
    overlap_consistency_weight: 1.0

# [핵심 수정] TrainingArguments가 사용하는 표준 인자만 여기에 남깁니다.
training_args:
  output_dir: "./checkpoints/stage1_vision_pretrain"
  run_name: "stage1-vision-pretrain"
  num_train_epochs: 3
  learning_rate: 2.0e-5
  eval_steps: 500
  save_steps: 500
  # (base.yaml에 있는 다른 표준 인자들은 자동으로 병합됩니다)

