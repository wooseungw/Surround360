# configs/base.yaml

# Wandb 공통 설정
wandb:
  project: "Surround360"

# 모델 공통 아키텍처 설정
model:
  # train.py의 Blip2Config.from_pretrained()에서 사용할 경로
  model_name_or_path: "Salesforce/blip2-opt-2.7b"
  # train.py의 Blip2Processor.from_pretrained()에서 사용할 경로
  pretrain_name: "Salesforce/blip2-opt-2.7b"

# 데이터 공통 처리 설정
data:
  image_size: [224, 224]
  do_crop: true
  fov: 90.0
  overlap_ratio: 0.5
  max_length: 128 # 기본 텍스트 길이 (각 스테이지에서 덮어쓰기 가능)

# 학습 인자 공통 설정
training_args:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  fp16: true
  report_to: "wandb"
  logging_strategy: "steps"
  logging_steps: 50
  save_strategy: "steps"
  save_total_limit: 2
  eval_strategy: "steps"

# DeepSpeed 설정
deepspeed:
  enabled: false
  config: "config/ds_config_zero3.json"