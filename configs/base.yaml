# configs/base.yaml

# ----------------------------------------------------------------
# Wandb 공통 설정
# ----------------------------------------------------------------
wandb:
  project: "SurroundBlip_Unified_Training" # 통합 프로젝트 이름

# ----------------------------------------------------------------
# 모델 공통 아키텍처 설정
# ----------------------------------------------------------------
model:
  # 모든 단계의 기반이 되는 모델 아키텍처
  pretrain_name: "Salesforce/blip2-opt-2.7b"
  # 모델 아키텍처 파라미터
  num_query_tokens: 32
  qformer:
    num_hidden_layers: 12

# ----------------------------------------------------------------
# 데이터 공통 처리 설정
# ----------------------------------------------------------------
data:
  image_size: [224, 224]
  do_crop: true
  fov: 90.0
  overlap_ratio: 0.5

# ----------------------------------------------------------------
# 학습 인자 공통 설정
# ----------------------------------------------------------------
training_args:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  fp16: true
  report_to: "wandb"
  logging_strategy: "steps"
  logging_steps: 50
  save_strategy: "steps"
  save_total_limit: 2
  evaluation_strategy: "steps"

deepspeed:
  enabled: false
  config: "config/ds_config_zero3.json"